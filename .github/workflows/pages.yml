# Refreshes the dashboard data and deploys the page to GitHub Pages.
# Only public EduIDE repos are read, so the workflow's own token is enough.
name: Dashboard

on:
  schedule:
    # Only a fallback that restarts the chain below: GitHub runs it hours late or skips it.
    - cron: "17 * * * *"
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  build:
    runs-on: ubuntu-latest
    concurrency: { group: pages-build, cancel-in-progress: true }
    steps:
      - uses: actions/checkout@v4
      - name: Collect data
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir site
          ./collect.sh > site/data.json
          cp index.html site/
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    concurrency: { group: pages-deploy, cancel-in-progress: true }
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4

  # Starts the next refresh, since the schedule above can't be relied on.
  # The refresh-timer environment has a 55 minute wait timer, which holds this job without using a runner.
  # A newer run cancels the waiting job, so there is only ever one timer.
  next:
    needs: deploy
    if: ${{ !cancelled() && github.ref == 'refs/heads/main' }}
    runs-on: ubuntu-latest
    environment: refresh-timer
    concurrency: { group: pages-timer, cancel-in-progress: true }
    permissions:
      actions: write
    steps:
      - env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run pages.yml --repo "$GITHUB_REPOSITORY" --ref main
