# Refreshes the dashboard data and deploys the page to GitHub Pages.
# Only public EduIDE repos are read, so the workflow's own token is enough.
name: Dashboard

on:
  schedule:
    # Hourly and off the full hour: the 15-minute schedule was never triggered by GitHub.
    - cron: "17 * * * *"
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Collect data
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir site
          ./collect.sh > site/data.json
          cp index.html site/
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
